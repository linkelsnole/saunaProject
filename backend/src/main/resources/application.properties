spring.application.name=modbus-api


server.port=8080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s


modbus.api.ip=127.0.0.1
modbus.api.port=4567
modbus.api.username=9131111111
modbus.api.password=1234
modbus.api.enable-http-logging=false

spring.datasource.url=jdbc:sqlite:sauna_app.db?busy_timeout=10000
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite пускает только одного писателя: один коннект в пуле (как в 301), иначе запись
# токена при входе конкурирует с журналом показаний и падает с SQLITE_BUSY
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.database-platform=org.sqlite.hibernate.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
# без этого коннект держится всю обработку запроса, а при пуле в 1 коннект это очередь на весь API
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET:XTxHeQ6Cdj53p0cr6ErkdujW4p8zpd+JfpLpYiyp5rAOXLTuUZ14WhZ5MYrjSy3B}
jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
jwt.refresh-token-expiration-ms=${JWT_REFRESH_TOKEN_EXPIRATION_MS:86400000}
jwt.refresh-cookie-name=${JWT_REFRESH_COOKIE_NAME:sauna_small_refresh_token}
jwt.refresh-cookie-path=${JWT_REFRESH_COOKIE_PATH:/api/v1/auth}
jwt.refresh-cookie-same-site=${JWT_REFRESH_COOKIE_SAME_SITE:Strict}
jwt.secure-cookie=${JWT_SECURE_COOKIE:false}
jwt.allowed-origins=${JWT_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}


modbus.api.connect-timeout=60
modbus.api.read-timeout=60
modbus.api.write-timeout=60


logging.level.com.example.modbus_api=INFO
